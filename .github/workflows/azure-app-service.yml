name: Deploy Sarthi Backend to Azure App Service (Docker)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/azure-app-service.yml'
  workflow_dispatch:

env:
  REGISTRY_SERVER: caa1ae1e049cacr.azurecr.io
  REGISTRY_USERNAME: caa1ae1e049cacr
  IMAGE_NAME: sarthi-backend
  APP_SERVICE_NAME: sarthi-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build Docker Image and Deploy to Azure App Service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_SERVER }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD || 'CgxZl4JEKHx2lHbcHV7imDdnuSZE37zLeYaebnIX0XcahJivHWbNJQQJ99CIACGhslBEqg7NAAACAZCR8Weo' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Azure Web App for Containers
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}:latest
